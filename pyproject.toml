[project]
name = "fast-volleyball-tracking-inference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "ffmpeg-python>=0.2.0",
    "onnxruntime>=1.29.0",
    "opencv-python>=4.13.0.92",
    "openvino>=2026.2.1",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "tqdm>=4.68.3",
]

[project.optional-dependencies]
# Not needed to run the pipeline: matplotlib backs the diagnostic plots in
# src/test_models.py and src/serv_det*.py, pytest runs the suite under tests/.
dev = [
    "matplotlib>=3.10.0",
    "pytest>=8.0.0",
]
